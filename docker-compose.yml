services:
  postgres:
    image: postgres:16-alpine
    container_name: ideas_vault_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "${POSTGRES_PORT:?set POSTGRES_PORT in .env}:5432"
    volumes: 
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    environment:
      Db__Host: postgres
      Db__Port: "5432"
      Db__Name: ${POSTGRES_DB}
      Db__User: ${POSTGRES_USER}
      Db__Password: ${POSTGRES_PASSWORD}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ideas_vault_be
    ports:
      - "${BACKEND_PORT:?set BACKEND_PORT in .env}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres_data:
