name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 10.0.x

    - name: Install dependencies
      run: dotnet restore IdeasVault.slnx
      
    - name: Lint (format check)
      run: dotnet format IdeasVault.slnx --verify-no-changes --no-restore

    - name: Build
      run: dotnet build IdeasVault.slnx -c Release --no-restore

    - name: Test
      run: dotnet test IdeasVault.slnx -c Release --no-build